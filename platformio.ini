[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/Seeed-Studio/Grove_LCD_RGB_Backlight.git

[env:diagnostic]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_flags =
    -D DIAGNOSTIC_MODE

lib_deps =
    https://github.com/Seeed-Studio/Grove_LCD_RGB_Backlight.git

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ignore =
    Hardware
    Display
build_src_filter = -<*>

; Normal controller with three labeled voltage ADC readings.
[env:calibration_voltage]
extends = env:nodemcu-32s
build_flags =
    -D VOLTAGE_CALIBRATION_MODE

; Normal controller with three labeled current ADC readings.
[env:calibration_current]
extends = env:nodemcu-32s
build_flags =
    -D CURRENT_CALIBRATION_MODE
