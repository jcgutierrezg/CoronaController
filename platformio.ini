[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/Seeed-Studio/Grove_LCD_RGB_Backlight.git

[env:diagnostic]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_flags =
    -D DIAGNOSTIC_MODE

lib_deps =
    https://github.com/Seeed-Studio/Grove_LCD_RGB_Backlight.git

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_ignore =
    Hardware
    Display
build_src_filter = -<*>
